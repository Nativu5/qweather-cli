name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer to publish, without the v prefix
        required: true
        type: string
      gate_run_id:
        description: Successful release-gate workflow run ID for the exact source SHA
        required: true
        type: string
      source_sha:
        description: Full 40-character SHA validated by the release gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: reconcile immutable release and npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: qweather-release-publish
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GATE_RUN_ID: ${{ inputs.gate_run_id }}
    steps:
      - name: Check out the exact gated release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate publication ref, version, source, and release gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer without a v prefix or leading zeros" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          fi

          release_ref="refs/heads/release/v${VERSION}"
          if [ "$GITHUB_REF" != "$release_ref" ]; then
            echo "publish requires ${release_ref}; selected ${GITHUB_REF}" >&2
            exit 1
          fi
          branch_output="$(git ls-remote --heads origin "$release_ref")"
          if [ "$(awk '{print $1}' <<<"$branch_output")" != "$SOURCE_SHA" ]; then
            echo "${release_ref} must point to gated source ${SOURCE_SHA}" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"
          test "$(jq -r .version packages/npm/package.json)" = "$VERSION"
          test "$(jq -r .version packages/npm/npm-shrinkwrap.json)" = "$VERSION"

          gate_json="$(gh run view "$GATE_RUN_ID" --json workflowName,status,conclusion,headSha,headBranch)"
          test "$(jq -r .workflowName <<<"$gate_json")" = "Release gate"
          test "$(jq -r .status <<<"$gate_json")" = "completed"
          test "$(jq -r .conclusion <<<"$gate_json")" = "success"
          test "$(jq -r .headSha <<<"$gate_json")" = "$SOURCE_SHA"
          test "$(jq -r .headBranch <<<"$gate_json")" = "release/v${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download and verify the exact retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$artifact_dir"
          gh run download "$GATE_RUN_ID" \
            --name "qweather-release-${VERSION}-${SOURCE_SHA}" \
            --dir "$artifact_dir"
          (cd "$artifact_dir" && sha256sum -c checksums.txt)
          go run ./tools/release inspect --version "$VERSION" --output "$artifact_dir"

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Stage one exact npm tarball
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/npm-stage"
          pack_dir="$RUNNER_TEMP/npm-pack"
          mkdir -p "$pack_dir"
          node packages/npm/scripts/stage-package.js \
            --checksums "$RUNNER_TEMP/release-artifacts/checksums.txt" \
            --output "$stage"
          npm pack "$stage" \
            --ignore-scripts \
            --json \
            --pack-destination "$pack_dir" > "$RUNNER_TEMP/npm-pack.json"
          filename="$(jq -er --arg version "$VERSION" '
            if type == "array" and length == 1 and
              .[0].name == "qweather-cli" and .[0].version == $version
            then .[0].filename
            else error("unexpected npm pack result")
            end
          ' "$RUNNER_TEMP/npm-pack.json")"
          tarball="$pack_dir/$filename"
          test -f "$tarball"
          test "$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          integrity="$(node - "$tarball" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const bytes = fs.readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${crypto.createHash('sha512').update(bytes).digest('base64')}`);
          NODE
          )"
          echo "NPM_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "EXPECTED_NPM_INTEGRITY=$integrity" >> "$GITHUB_ENV"

      - name: Reconcile npm registry state before GitHub mutations
        shell: bash
        run: |
          set -euo pipefail

          is_not_found() {
            node - "$1" <<'NODE'
          const fs = require('node:fs');
          let value;
          try {
            value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch {
            process.exit(1);
          }
          process.exit(value?.error?.code === 'E404' ? 0 : 1);
          NODE
          }

          set +e
          npm view qweather-cli name repository.url --json \
            > "$RUNNER_TEMP/npm-package.json" 2> "$RUNNER_TEMP/npm-package.err"
          package_status=$?
          npm view "qweather-cli@${VERSION}" name version dist.integrity repository.url --json \
            > "$RUNNER_TEMP/npm-version.json" 2> "$RUNNER_TEMP/npm-version.err"
          version_status=$?
          set -e

          if [ "$package_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/npm-package.err" >&2
            cat "$RUNNER_TEMP/npm-package.json" >&2
            exit 1
          fi
          node - "$RUNNER_TEMP/npm-package.json" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const normalize = (url) => String(url).replace(/^git\+/, '').replace(/\.git$/, '').replace(/\/$/, '');
          if (value.name !== 'qweather-cli' || normalize(value['repository.url']) !== 'https://github.com/Nativu5/qweather-cli') {
            throw new Error('qweather-cli is published by an unexpected package owner or repository');
          }
          NODE

          if [ "$version_status" -eq 0 ]; then
            node - "$RUNNER_TEMP/npm-version.json" "$VERSION" "$EXPECTED_NPM_INTEGRITY" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const version = process.argv[3];
          const integrity = process.argv[4];
          const normalize = (url) => String(url).replace(/^git\+/, '').replace(/\.git$/, '').replace(/\/$/, '');
          if (value.name !== 'qweather-cli' || value.version !== version ||
              normalize(value['repository.url']) !== 'https://github.com/Nativu5/qweather-cli') {
            throw new Error(`qweather-cli@${version} has unexpected package identity`);
          }
          if (value['dist.integrity'] !== integrity) {
            throw new Error(`qweather-cli@${version} integrity does not match the exact gated tarball`);
          }
          NODE
            echo "NPM_ACTION=accept" >> "$GITHUB_ENV"
          elif is_not_found "$RUNNER_TEMP/npm-version.json"; then
            echo "NPM_ACTION=publish" >> "$GITHUB_ENV"
          else
            cat "$RUNNER_TEMP/npm-version.err" >&2
            cat "$RUNNER_TEMP/npm-version.json" >&2
            exit 1
          fi

      - name: Reconcile the GitHub tag, Release, and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          tag_ref="refs/tags/${tag}"
          state="$RUNNER_TEMP/release-state.json"
          state_error="$RUNNER_TEMP/release-state.err"
          expected="$RUNNER_TEMP/release-expected-assets.txt"
          actual="$RUNNER_TEMP/release-actual-assets.txt"
          missing="$RUNNER_TEMP/release-missing-assets.txt"
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          find "$artifact_dir" -maxdepth 1 -type f -printf '%f\n' | sort > "$expected"

          inspect_remote_tag() {
            local remote_output
            remote_output="$(git ls-remote --refs origin "$tag_ref")"
            if [ -z "$remote_output" ]; then
              TAG_EXISTS=false
              TAG_COMMIT=""
              return
            fi
            if [ "$(wc -l <<< "$remote_output")" -ne 1 ]; then
              echo "remote tag lookup returned an unexpected result for ${tag}" >&2
              exit 1
            fi
            git fetch --force --no-tags origin "$tag_ref:$tag_ref"
            if [ "$(git cat-file -t "$tag_ref")" != "tag" ]; then
              echo "existing ${tag} is not an annotated tag" >&2
              exit 1
            fi
            TAG_EXISTS=true
            TAG_COMMIT="$(git rev-parse "${tag_ref}^{commit}")"
          }

          load_release() {
            if gh release view "$tag" --json tagName,isDraft,isPrerelease,assets > "$state" 2> "$state_error"; then
              RELEASE_EXISTS=true
              return
            fi
            if grep -Eqi 'release not found|HTTP 404' "$state_error"; then
              RELEASE_EXISTS=false
              return
            fi
            cat "$state_error" >&2
            exit 1
          }

          verify_existing_assets() {
            jq -r '[.assets[].name] | sort | .[]' "$state" > "$actual"
            duplicate="$(jq -r '[.assets[].name] | group_by(.)[] | select(length > 1) | .[0]' "$state")"
            if [ -n "$duplicate" ]; then
              echo "Release contains duplicate asset ${duplicate}" >&2
              exit 1
            fi
            unexpected="$(comm -13 "$expected" "$actual")"
            if [ -n "$unexpected" ]; then
              echo "Release contains unexpected assets:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              local_digest="sha256:$(sha256sum "$artifact_dir/$asset" | awk '{print $1}')"
              remote_digest="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' "$state")"
              remote_state="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .state' "$state")"
              if [ "$remote_state" != "uploaded" ] || [ "$remote_digest" != "$local_digest" ]; then
                echo "Release asset ${asset} does not match the exact gated artifact" >&2
                exit 1
              fi
            done < "$actual"
            comm -23 "$expected" "$actual" > "$missing"
          }

          verify_release_metadata() {
            test "$(jq -r .tagName "$state")" = "$tag"
            if [ "$(jq -r .isPrerelease "$state")" != false ]; then
              echo "existing ${tag} Release is unexpectedly marked as a prerelease" >&2
              exit 1
            fi
          }

          # Inspect every durable surface before creating any missing object.
          inspect_remote_tag
          if [ "$TAG_EXISTS" = true ] && [ "$TAG_COMMIT" != "$SOURCE_SHA" ]; then
            echo "existing ${tag} does not peel to gated source ${SOURCE_SHA}" >&2
            exit 1
          fi
          load_release
          if [ "$RELEASE_EXISTS" = true ]; then
            verify_release_metadata
            verify_existing_assets
            if [ "$(jq -r .isDraft "$state")" = false ] && [ -s "$missing" ]; then
              echo "public Release is missing expected assets and cannot be modified" >&2
              exit 1
            fi
          fi

          if [ "$TAG_EXISTS" = false ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" "$SOURCE_SHA" -m "Release ${tag}"
            git push origin "$tag_ref"
            inspect_remote_tag
            if [ "$TAG_EXISTS" != true ] || [ "$TAG_COMMIT" != "$SOURCE_SHA" ]; then
              echo "created ${tag} did not read back as the exact annotated tag" >&2
              exit 1
            fi
          fi

          if [ "$RELEASE_EXISTS" = false ]; then
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "QWeather CLI ${tag}" \
              --notes "QWeather CLI ${tag}"
            load_release
          fi

          # Re-read after tag creation so a concurrent external change is
          # validated before any Release asset mutation.
          load_release
          verify_release_metadata
          verify_existing_assets
          if [ "$(jq -r .isDraft "$state")" = true ]; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release upload "$tag" "$artifact_dir/$asset"
            done < "$missing"
            load_release
            verify_existing_assets
            if [ -s "$missing" ]; then
              echo "draft Release is still missing expected assets" >&2
              exit 1
            fi
            gh release edit "$tag" --draft=false
            load_release
          elif [ -s "$missing" ]; then
            echo "public Release is missing expected assets and cannot be modified" >&2
            exit 1
          fi

          test "$(jq -r .isDraft "$state")" = false
          verify_existing_assets
          test ! -s "$missing"

      - name: Verify anonymous public asset reads
        shell: bash
        run: |
          set -euo pipefail
          readback="$RUNNER_TEMP/public-readback"
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          rm -rf "$readback"
          mkdir -p "$readback"
          for asset in "$artifact_dir"/*; do
            name="$(basename "$asset")"
            curl --fail --silent --show-error --location \
              --output "$readback/$name" \
              "https://github.com/Nativu5/qweather-cli/releases/download/v${VERSION}/${name}"
            cmp -- "$asset" "$readback/$name"
          done
          test "$(find "$readback" -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$(find "$artifact_dir" -maxdepth 1 -type f -printf '%f\n' | sort)"
          (cd "$readback" && sha256sum -c checksums.txt)
          go run ./tools/release inspect --version "$VERSION" --output "$readback"

      - name: Publish or accept the exact npm tarball
        shell: bash
        run: |
          set -euo pipefail
          publish_status=0
          if [ "$NPM_ACTION" = publish ]; then
            set +e
            npm publish "$NPM_TARBALL" --provenance --access public
            publish_status=$?
            set -e
          fi

          set +e
          npm view "qweather-cli@${VERSION}" name version dist.integrity repository.url --json \
            > "$RUNNER_TEMP/npm-published.json" 2> "$RUNNER_TEMP/npm-published.err"
          view_status=$?
          set -e
          if [ "$view_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/npm-published.err" >&2
            cat "$RUNNER_TEMP/npm-published.json" >&2
            if [ "$publish_status" -ne 0 ]; then
              echo "npm publish failed before the exact package became observable; rerun this workflow after correcting the publisher" >&2
            fi
            exit 1
          fi
          node - "$RUNNER_TEMP/npm-published.json" "$VERSION" "$EXPECTED_NPM_INTEGRITY" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const version = process.argv[3];
          const integrity = process.argv[4];
          const normalize = (url) => String(url).replace(/^git\+/, '').replace(/\.git$/, '').replace(/\/$/, '');
          if (value.name !== 'qweather-cli' || value.version !== version ||
              normalize(value['repository.url']) !== 'https://github.com/Nativu5/qweather-cli') {
            throw new Error(`qweather-cli@${version} has unexpected package identity`);
          }
          if (value['dist.integrity'] !== integrity) {
            throw new Error(`qweather-cli@${version} integrity does not match the exact gated tarball`);
          }
          NODE
          if [ "$publish_status" -ne 0 ]; then
            echo "npm publish returned an error, but the exact tarball is now present; publication reconciled successfully"
          fi
