name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer to publish, without the v prefix
        required: true
        type: string
      gate_run_id:
        description: Successful release-gate workflow run ID for the exact source SHA
        required: true
        type: string
      source_sha:
        description: Full 40-character SHA validated by the release gate
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish immutable release and npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: qweather-release-publish
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GATE_RUN_ID: ${{ inputs.gate_run_id }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: release/v${{ inputs.version }}
          fetch-depth: 0

      - name: Validate version, source branch, and release gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer without a v prefix or leading zeros" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gate_json="$(gh run view "$GATE_RUN_ID" --json workflowName,status,conclusion,headSha,headBranch)"
          test "$(jq -r .workflowName <<<"$gate_json")" = "Release gate"
          test "$(jq -r .status <<<"$gate_json")" = "completed"
          test "$(jq -r .conclusion <<<"$gate_json")" = "success"
          test "$(jq -r .headSha <<<"$gate_json")" = "$SOURCE_SHA"
          test "$(jq -r .headBranch <<<"$gate_json")" = "release/v${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify the exact retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          gh run download "$GATE_RUN_ID" \
            --name "qweather-release-${VERSION}-${SOURCE_SHA}" \
            --dir "$RUNNER_TEMP/release-artifacts"
          sha256sum -c "$RUNNER_TEMP/release-artifacts/checksums.txt"
          go run ./tools/release inspect --version "$VERSION" --output "$RUNNER_TEMP/release-artifacts"

      - name: Recheck npm name availability before publication
        shell: bash
        run: |
          set +e
          npm view qweather-cli name version --json >/tmp/qweather-npm-name.json 2>/tmp/qweather-npm-name.err
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "qweather-cli is already published; stop without changing the Release" >&2
            cat /tmp/qweather-npm-name.json >&2
            exit 1
          fi
          if ! grep -q 'E404\|Not Found' /tmp/qweather-npm-name.err /tmp/qweather-npm-name.json; then
            cat /tmp/qweather-npm-name.err >&2
            exit 1
          fi

      - name: Refuse to rewrite an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists; immutable publication stops" >&2
            exit 1
          fi

      - name: Stage the exact npm package for later publication
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/npm-stage"
          node packages/npm/scripts/stage-package.js \
            --checksums "$RUNNER_TEMP/release-artifacts/checksums.txt" \
            --output "$stage"

      - name: Create the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v${VERSION}" "$SOURCE_SHA" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create the draft GitHub Release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --verify-tag \
            --draft \
            --title "QWeather CLI v${VERSION}" \
            --notes "QWeather CLI v${VERSION}" \
            "$RUNNER_TEMP/release-artifacts"/*
          expected="$(find "$RUNNER_TEMP/release-artifacts" -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "v${VERSION}" --json assets --jq '[.assets[].name] | sort | .[]')"
          test "$actual" = "$expected"

      - name: Publish the GitHub Release and verify anonymous asset reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" --draft=false
          for asset in "$RUNNER_TEMP/release-artifacts"/*; do
            curl --fail --silent --show-error --location --output /dev/null \
              "https://github.com/Nativu5/qweather-cli/releases/download/v${VERSION}/$(basename "$asset")"
          done

      - name: Publish the exact npm package after public asset verification
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/npm-stage" --provenance --access public
