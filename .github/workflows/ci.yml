name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Verify modules
        run: make mod-verify

      - name: Verify generated Skill and OpenAPI snapshot
        run: make skill-check

      - name: Run unit tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run vet
        run: make vet

      - name: Build CLI
        run: make build BINARY="$RUNNER_TEMP/qweather"

      - name: Compile live E2E package without running tests
        run: make e2e-compile

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make ci-diff-check

      - name: Set up Node.js 22.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: packages/npm/npm-shrinkwrap.json

      - name: Pin npm 11.16.0 on Node.js 22
        run: npm install --global npm@11.16.0

      - name: Install npm adapter dependencies on Node.js 22
        working-directory: packages/npm
        run: npm ci --ignore-scripts

      - name: Test npm adapter on Node.js 22
        working-directory: packages/npm
        run: npm test --ignore-scripts

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: packages/npm/npm-shrinkwrap.json

      - name: Pin npm 11.16.0 on Node.js 24
        run: npm install --global npm@11.16.0

      - name: Install npm adapter dependencies on Node.js 24
        working-directory: packages/npm
        run: npm ci --ignore-scripts

      - name: Test npm adapter on Node.js 24
        working-directory: packages/npm
        run: npm test --ignore-scripts

      - name: Check reproducible npm pack
        working-directory: packages/npm
        run: npm run pack:check

      - name: Run local npm install/version smoke
        run: make npm-smoke
