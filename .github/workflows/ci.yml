name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Verify modules
        run: make mod-verify

      - name: Run unit tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run vet
        run: make vet

      - name: Build CLI
        run: make build BINARY="$RUNNER_TEMP/qweather"

      - name: Compile live E2E package without running tests
        run: make e2e-compile

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make ci-diff-check
