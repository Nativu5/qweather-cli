name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without the v prefix, for example 0.1.0
        required: true
        type: string
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  open_version_pr:
    name: open reviewed version PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate stable version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer without a v prefix or leading zeros" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release-prep/v${VERSION}" >/dev/null 2>&1; then
            echo "release-prep/v${VERSION} already exists; inspect the existing version PR" >&2
            exit 1
          fi

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Pin npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Synchronize the version source and npm metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > VERSION
          cd packages/npm
          npm version --no-git-tag-version --ignore-scripts "$VERSION"
          test ! -e package-lock.json

      - name: Open the reviewable version PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "release-prep/v${VERSION}"
          git add VERSION packages/npm/package.json packages/npm/npm-shrinkwrap.json
          git diff --cached --check
          git commit -m "chore(release): prepare v${VERSION}"
          git push --set-upstream origin "release-prep/v${VERSION}"
          gh pr create \
            --base main \
            --head "release-prep/v${VERSION}" \
            --title "chore(release): prepare v${VERSION}" \
            --body "This version PR synchronizes VERSION and npm metadata for v${VERSION}. It does not create a tag, Release, asset, or npm publication. The Release gate remains a separate exact-SHA handoff."

  cut_release_branch:
    name: cut exact release branch and dispatch gate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-prep/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create the exact release branch
        id: release
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#release-prep/v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "merged version branch is invalid: $HEAD_REF" >&2
            exit 1
          fi
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
          git switch -c "release/v${version}"
          git push --set-upstream origin "release/v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch the exact release gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run release-gate.yml --ref "release/v${VERSION}" --field "version=${VERSION}"
