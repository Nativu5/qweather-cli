name: Release gate
run-name: Release gate v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without the v prefix, for example 1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require a matching stable release branch
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be stable SemVer without a v prefix or leading zeros" >&2
            exit 1
          fi
          expected_ref="refs/heads/release/v${VERSION}"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "::error::release gate requires ${expected_ref}; selected ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deterministic:
    name: deterministic gates
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: reproducible six-target package
    needs:
      - validate
      - deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Double-build and verify release artifacts
        run: make release-verify VERSION="${{ inputs.version }}"

      - name: Verify the final artifact directory
        run: go run ./tools/release inspect --version "${{ inputs.version }}" --output dist

      - name: Upload the exact retained artifact set
        uses: actions/upload-artifact@v4
        with:
          name: qweather-release-${{ inputs.version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: approved live smoke
    needs:
      - validate
      - deterministic
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: qweather-release-smoke
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download the exact retained artifact
        uses: actions/download-artifact@v4
        with:
          name: qweather-release-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Verify checksums and extract Linux amd64 binary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-artifacts"
          sha256sum -c checksums.txt
          mkdir -p "$RUNNER_TEMP/release-extract"
          tar -xzf "qweather-cli_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/release-extract"
          chmod 0755 "$RUNNER_TEMP/release-extract/qweather-cli_${VERSION}_linux_amd64/qweather"

      - name: Run the three approved Basic calls
        env:
          QWEATHER_E2E_BINARY: ${{ runner.temp }}/release-extract/qweather-cli_${{ inputs.version }}_linux_amd64/qweather
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
        run: go test -tags=e2e ./tests/e2e -run '^TestReleaseSmoke$' -count=1

  release_ready:
    name: release ready
    needs:
      - validate
      - deterministic
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the non-publishing gate result
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "Release v${VERSION} passed deterministic and approved live gates."
            echo "Validated source: ${GITHUB_SHA}"
            echo "Retained artifact: qweather-release-${VERSION}-${GITHUB_SHA} (14 days)."
            echo "Artifact publication and npm publication are not part of this workflow and remain owned by Issue #8."
          } >> "$GITHUB_STEP_SUMMARY"
